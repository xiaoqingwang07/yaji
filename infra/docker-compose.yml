services:
  postgres:
    image: postgres:16-alpine
    container_name: yaji-postgres
    environment:
      POSTGRES_USER: yaji
      POSTGRES_PASSWORD: yaji
      POSTGRES_DB: yaji
    ports:
      - "5432:5432"
    volumes:
      - yaji_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: yaji-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yaji
      MINIO_ROOT_PASSWORD: yaji-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yaji_minio:/data

volumes:
  yaji_pg:
  yaji_minio:
